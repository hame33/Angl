<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Film Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --bg2: #141416;
    --bg3: #1c1c1f;
    --bg4: #232327;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f2;
    --text2: #9090a0;
    --text3: #55556a;
    --accent: #e8782a;
    --accent-bg: rgba(232,120,42,0.12);
    --accent-border: rgba(232,120,42,0.35);
    --info: #3d8ef0;
    --info-bg: rgba(61,142,240,0.1);
    --info-border: rgba(61,142,240,0.3);
    --success: #3ecf8e;
    --danger: #f05252;
    --danger-bg: rgba(240,82,82,0.1);
    --radius: 8px;
    --radius-lg: 12px;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Layout ── */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr 280px;
    grid-template-rows: 48px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Topbar ── */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .topbar-logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 15px; color: var(--accent);
    flex-shrink: 0;
  }
  .topbar-logo svg { width: 22px; height: 22px; }
  .topbar-divider { width: 1px; height: 24px; background: var(--border); }
  .url-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .url-input:focus { border-color: var(--border2); }
  .url-input::placeholder { color: var(--text3); }
  .btn {
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg4); border-color: var(--border2); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.accent:hover { background: #d0691f; border-color: #d0691f; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--bg3); border-color: var(--border); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

  /* ── Playlists sidebar ── */
  .sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .sidebar-title { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text2); }
  .icon-btn {
    width: 26px; height: 26px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--bg3); color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); border-color: rgba(240,82,82,0.3); }
  .icon-btn svg { width: 14px; height: 14px; }

  .playlist-list { flex: 1; overflow-y: auto; padding: 8px 8px; }
  .playlist-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
  }
  .playlist-item:hover { background: var(--bg3); }
  .playlist-item.active { background: var(--accent-bg); }
  .playlist-item.active .pl-name { color: var(--accent); }
  .pl-icon {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--bg4); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .playlist-item.active .pl-icon { background: var(--accent-bg); }
  .pl-info { flex: 1; min-width: 0; }
  .pl-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-count { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .pl-actions { display: none; gap: 2px; }
  .playlist-item:hover .pl-actions { display: flex; }

  .pl-add-form {
    padding: 10px 10px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .pl-add-form input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    margin-bottom: 6px;
  }
  .pl-add-form input:focus { border-color: var(--accent-border); }
  .pl-add-form input::placeholder { color: var(--text3); }
  .pl-emoji-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .emoji-opt {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg3);
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.12s;
  }
  .emoji-opt.selected { border-color: var(--accent); background: var(--accent-bg); }

  /* ── Main area ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  .player-wrap {
    position: relative;
    width: 100%;
    flex-shrink: 0;
    aspect-ratio: 16/9;
    max-height: 55vh;
    background: #000;
  }
  .player-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
  .player-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--text3);
  }
  .player-placeholder svg { width: 48px; height: 48px; opacity: 0.4; }
  .player-placeholder p { font-size: 13px; }

  /* ── Playback bar ── */
  .playback-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .play-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  .play-btn:hover { background: #d0691f; }
  .play-btn:active { transform: scale(0.95); }
  .play-btn:disabled { background: var(--bg4); color: var(--text3); cursor: not-allowed; }
  .play-btn svg { width: 16px; height: 16px; }

  .clip-nav { display: flex; gap: 4px; }
  .nav-btn { width: 30px; height: 30px; }

  .now-playing { flex: 1; min-width: 0; }
  .now-label { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .now-sub { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }

  .loop-toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text2); cursor: pointer;
    user-select: none; white-space: nowrap;
  }
  .loop-toggle input { accent-color: var(--accent); cursor: pointer; }
  .loop-toggle.on { color: var(--accent); }

  .free-btn {
    padding: 5px 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .free-btn:hover { background: var(--bg3); color: var(--text); }
  .free-btn.active { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }

  /* ── Add clip panel ── */
  .add-clip-panel {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text3);
    margin-bottom: 8px;
  }

  .field-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .field-row label { font-size: 12px; color: var(--text2); min-width: 36px; }
  .time-input {
    width: 72px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 8px;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
  }
  .time-input:focus { border-color: var(--border2); }
  .get-time-btn {
    font-size: 11px; padding: 4px 8px;
    background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text2); cursor: pointer;
    font-family: var(--sans);
    transition: background 0.12s;
  }
  .get-time-btn:hover { background: var(--bg3); color: var(--text); }

  .buffer-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .buffer-row label { font-size: 12px; color: var(--text2); min-width: 50px; }
  .buffer-row input[type=range] {
    flex: 1; accent-color: var(--accent);
    -webkit-appearance: none; height: 4px;
    background: var(--bg4); border-radius: 2px; outline: none; cursor: pointer;
  }
  .buffer-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  .buf-val { font-size: 12px; font-family: var(--mono); color: var(--text); min-width: 30px; text-align: right; }

  .text-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .text-input:focus { border-color: var(--border2); }
  .text-input::placeholder { color: var(--text3); }

  .pl-select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .pl-select:focus { border-color: var(--border2); }

  .divider { height: 1px; background: var(--border); margin: 2px 0; }

  /* ── Clips right panel ── */
  .clips-panel {
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .clips-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .clips-title { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text2); }
  .clip-count-badge {
    font-size: 11px; font-family: var(--mono);
    background: var(--bg4); color: var(--text2);
    padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--border);
  }

  .clip-list { flex: 1; overflow-y: auto; padding: 8px; }

  .clip-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 9px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.1s;
    margin-bottom: 2px;
  }
  .clip-item:hover { background: var(--bg3); }
  .clip-item.active { background: var(--info-bg); outline: 1px solid var(--info-border); }
  .clip-num {
    width: 20px; height: 20px; border-radius: 5px;
    background: var(--bg4); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; font-family: var(--mono);
    color: var(--text2); margin-top: 1px;
  }
  .clip-item.active .clip-num { background: var(--info-bg); color: var(--info); }
  .clip-body { flex: 1; min-width: 0; }
  .clip-label-text { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .clip-meta { font-size: 10px; font-family: var(--mono); color: var(--text3); }
  .clip-pl-badge {
    font-size: 10px; padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--text3);
    background: var(--bg4);
    display: inline-block; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
  }
  .clip-btns { display: none; gap: 2px; flex-shrink: 0; }
  .clip-item:hover .clip-btns { display: flex; }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--text3); font-size: 12px;
    padding: 3rem 1rem; text-align: center;
  }
  .empty-state svg { width: 32px; height: 32px; opacity: 0.4; }

  /* ── Export ── */
  .clips-footer {
    padding: 10px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    display: flex; gap: 6px;
  }

  /* ── Scrollbars ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border2); }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg4); color: var(--text); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 8px 16px; font-size: 13px;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 999; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius-lg); padding: 20px; width: 340px;
  }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>

<div class="app">

  <!-- ── Topbar ── -->
  <header class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M5 12h14M12 5c-2.5 2.5-2.5 9.5 0 14M12 5c2.5 2.5 2.5 9.5 0 14"/>
      </svg>
      Film Room
    </div>
    <div class="topbar-divider"></div>
    <input class="url-input" id="yt-url" placeholder="Paste YouTube URL…" />
    <button class="btn accent" onclick="loadVideo()">Load film</button>
    <div class="topbar-divider"></div>
    <button class="btn" onclick="exportJSON()" title="Export all clips as JSON">Export</button>
    <button class="btn" onclick="document.getElementById('import-file').click()" title="Import clips from JSON">Import</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(event)" />
  </header>

  <!-- ── Playlists sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Playlists</span>
      <button class="icon-btn" onclick="toggleAddPlaylist()" title="New playlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="playlist-list" id="playlist-list"></div>

    <div class="pl-add-form" id="pl-add-form" style="display:none">
      <input id="pl-name-input" placeholder="Playlist name…" onkeydown="if(event.key==='Enter')createPlaylist()" maxlength="40" />
      <div class="pl-emoji-row" id="emoji-row"></div>
      <div style="display:flex;gap:6px">
        <button class="btn" style="flex:1;font-size:12px;padding:5px" onclick="createPlaylist()">Create</button>
        <button class="btn ghost" style="font-size:12px;padding:5px" onclick="toggleAddPlaylist()">Cancel</button>
      </div>
    </div>
  </aside>

  <!-- ── Main center ── -->
  <main class="main">
    <!-- Player -->
    <div class="player-wrap" id="player-wrap">
      <div class="player-placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="2" width="20" height="20" rx="2.5"/>
          <path d="M10 8l6 4-6 4V8z"/>
        </svg>
        <p>Load a YouTube URL to begin</p>
      </div>
      <div id="player-container" style="display:none; width:100%; height:100%;"></div>
    </div>

    <!-- Playback bar -->
    <div class="playback-bar">
      <button class="play-btn" id="play-btn" onclick="togglePlay()" disabled>
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="clip-nav">
        <button class="icon-btn nav-btn" onclick="prevClip()" title="Previous clip">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="icon-btn nav-btn" onclick="nextClip()" title="Next clip">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="now-playing">
        <div class="now-label" id="now-label">No clip selected</div>
        <div class="now-sub" id="now-sub">Select a clip or add one below</div>
      </div>
      <label class="loop-toggle" id="loop-label">
        <input type="checkbox" id="loop-toggle" onchange="updateLoop()" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">
          <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        Loop clip
      </label>
      <button class="free-btn" id="free-btn" onclick="toggleFreeMode()" title="Release clip enforcement and scrub freely">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;vertical-align:-2px;margin-right:4px"><path d="M15 3h6v6M14 10l6.1-6.1M9 21H3v-6M10 14l-6.1 6.1"/></svg>
        Free scrub
      </button>
    </div>

    <!-- Add clip form -->
    <div class="add-clip-panel">
      <div>
        <div class="section-label">New clip</div>

        <div class="field-row">
          <label>Start</label>
          <input type="text" class="time-input" id="start-time" placeholder="0:00" />
          <button class="get-time-btn" onclick="captureTime('start')">↓ current</button>
        </div>
        <div class="field-row">
          <label>End</label>
          <input type="text" class="time-input" id="end-time" placeholder="0:10" />
          <button class="get-time-btn" onclick="captureTime('end')">↓ current</button>
        </div>
      </div>

      <div>
        <div class="section-label">Buffer</div>
        <div class="buffer-row">
          <label>Before</label>
          <input type="range" id="buf-before" min="0" max="15" step="0.5" value="2" oninput="updateBufDisplay()" />
          <span class="buf-val" id="buf-before-val">2s</span>
        </div>
        <div class="buffer-row">
          <label>After</label>
          <input type="range" id="buf-after" min="0" max="15" step="0.5" value="2" oninput="updateBufDisplay()" />
          <span class="buf-val" id="buf-after-val">2s</span>
        </div>
      </div>

      <div>
        <div class="section-label">Label & playlist</div>
        <input type="text" class="text-input" id="clip-label" placeholder="Clip label (e.g. Pick & roll, fast break…)" style="margin-bottom:8px" />
        <select class="pl-select" id="clip-playlist"></select>
      </div>

      <button class="btn accent" style="width:100%;padding:9px;font-size:14px" onclick="addClip()">
        + Add clip
      </button>
    </div>
  </main>

  <!-- ── Clips right panel ── -->
  <aside class="clips-panel">
    <div class="clips-header">
      <span class="clips-title" id="clips-panel-title">All clips</span>
      <span class="clip-count-badge" id="clips-count">0</span>
    </div>
    <div class="clip-list" id="clip-list"></div>
    <div class="clips-footer">
      <button class="btn ghost" id="play-all-btn" style="flex:1;font-size:12px" onclick="playAll()">▶ Play all</button>
      <button class="btn ghost" style="flex:1;font-size:12px" onclick="clearAllClips()">Clear list</button>
    </div>
  </aside>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Rename modal -->
<div class="modal-overlay hidden" id="rename-modal">
  <div class="modal">
    <h3>Rename playlist</h3>
    <input type="text" class="text-input" id="rename-input" maxlength="40" />
    <div class="modal-footer">
      <button class="btn ghost" onclick="closeRenameModal()">Cancel</button>
      <button class="btn accent" onclick="confirmRename()">Rename</button>
    </div>
  </div>
</div>

<script>
/* ── State ── */
let player = null;
let videoLoaded = false;
let currentVideoId = null;
let pendingSeek = null;   // {start, play} — applied once a newly loaded player is ready
let clips = [];
let playlists = [];
let activeClipIdx = -1;
let activePl = null; // null = show all
let isPlaying = false;
let loopEnabled = false;
let watchInterval = null;
let renameTarget = null;
let selectedEmoji = '🏀';

const EMOJIS = ['🏀','🎬','⚡','🔥','🛡️','🎯','💡','📌'];

/* ── Init ── */
window.addEventListener('DOMContentLoaded', () => {
  loadFromStorage();
  buildEmojiRow();
  renderPlaylists();
  renderClips();
  updatePlaylistSelect();
  updateBufDisplay();
  // Reload the film we were last working on so clips stay playable across sessions
  if (document.getElementById('yt-url').value) loadVideo();
});

/* ── Persistence ── */
function saveToStorage() {
  try {
    localStorage.setItem('filmroom_clips', JSON.stringify(clips));
    localStorage.setItem('filmroom_playlists', JSON.stringify(playlists));
    if (currentVideoId) localStorage.setItem('filmroom_video', currentVideoId);
  } catch(e) {}
}
function loadFromStorage() {
  try {
    const c = localStorage.getItem('filmroom_clips');
    const p = localStorage.getItem('filmroom_playlists');
    const v = localStorage.getItem('filmroom_video');
    if (c) clips = JSON.parse(c);
    if (p) playlists = JSON.parse(p);
    if (v) document.getElementById('yt-url').value = 'https://www.youtube.com/watch?v=' + v;
    if (!playlists.length) {
      playlists = [{ id: uid(), name: 'General', emoji: '🏀' }];
    }
  } catch(e) {
    playlists = [{ id: uid(), name: 'General', emoji: '🏀' }];
  }
}

/* ── Utilities ── */
function uid() { return Math.random().toString(36).slice(2, 9); }
function parseTime(str) {
  str = (str || '').trim();
  const parts = str.split(':').map(Number);
  if (parts.length === 2) return parts[0] * 60 + (parts[1] || 0);
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + (parts[2] || 0);
  return parseFloat(str) || 0;
}
function fmt(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  return m + ':' + String(s).padStart(2,'0');
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

/* ── YouTube ── */
function extractVideoId(url) {
  url = url.trim();
  if (!url) return null;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const patterns = [
    /youtu\.be\/([^?&\s\/#]+)/,
    /[?&]v=([^&\s#]+)/,
    /youtube\.com\/embed\/([^?&\s\/#]+)/,
    /youtube\.com\/shorts\/([^?&\s\/#]+)/,
    /youtube\.com\/v\/([^?&\s\/#]+)/,
  ];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  return null;
}

function loadVideo(vidOverride) {
  const vid = vidOverride || extractVideoId(document.getElementById('yt-url').value.trim());
  if (!vid) { toast('Could not find a YouTube video ID in that URL.'); return; }

  // Tear down any existing player before swapping films
  stopWatcher();
  videoLoaded = false;
  if (player && player.destroy) { try { player.destroy(); } catch(e) {} }
  player = null;

  currentVideoId = vid;
  saveToStorage();
  document.getElementById('placeholder').style.display = 'none';
  const c = document.getElementById('player-container');
  c.style.display = 'block';
  c.innerHTML = '<div id="yt-player" style="width:100%;height:100%"></div>';
  if (window.YT && window.YT.Player) { createPlayer(vid); }
  else {
    window._ytPendingVid = vid;
    if (!document.getElementById('yt-api')) {
      const s = document.createElement('script');
      s.id = 'yt-api';
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }
  }
}
window.onYouTubeIframeAPIReady = () => { if (window._ytPendingVid) createPlayer(window._ytPendingVid); };
function createPlayer(vid) {
  player = new YT.Player('yt-player', {
    videoId: vid,
    host: 'https://www.youtube-nocookie.com',
    playerVars: { controls: 1, rel: 0, modestbranding: 1, playsinline: 1, origin: window.location.href },
    events: {
      onReady: () => {
        videoLoaded = true;
        document.getElementById('play-btn').disabled = activeClipIdx < 0;
        if (pendingSeek) {
          const p = pendingSeek; pendingSeek = null;
          player.seekTo(p.start, true);
          if (p.play) player.playVideo();
        }
      },
      onStateChange: (e) => {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING) {
          setPlayIcon(true); isPlaying = true;
          // Only start watcher if not already running (don't restart on every buffer resume)
          if (!watchInterval) startWatcher();
        } else if (e.data === S.PAUSED || e.data === S.ENDED) {
          // User-initiated pause or natural end — stop watcher and update icon
          stopWatcher(); setPlayIcon(false); isPlaying = false;
        }
        // BUFFERING (3) and CUED (5): do nothing — watcher keeps running through buffer stalls
      }
    }
  });
}

function startWatcher() {
  if (watchInterval) clearInterval(watchInterval); // restart with correct interval
  watchInterval = setInterval(() => {
    if (!player || activeClipIdx < 0) return;
    // Only enforce end-time when actually playing — ignore buffer stalls
    if (freeMode) return; // free scrub — never enforce clip boundaries
    const state = player.getPlayerState();
    if (state !== YT.PlayerState.PLAYING) return;
    const clip = visibleClips()[activeClipIdx];
    if (!clip) return;
    const cur = player.getCurrentTime();
    if (cur >= clip.effEnd) {
      if (loopEnabled) {
        player.seekTo(clip.effStart, true);
        player.playVideo();
      } else if (playAllMode) {
        // Auto-advance to next clip
        const vis = visibleClips();
        const nextIdx = activeClipIdx + 1;
        if (nextIdx < vis.length) {
          playClipAtIdx(nextIdx, { keepPlayAll: true });
        } else {
          // End of playlist
          stopWatcher();
          playAllMode = false;
          updatePlayAllBtn();
          player.pauseVideo();
          toast('End of playlist');
        }
      } else {
        stopWatcher();
        player.pauseVideo();
      }
    }
  }, playAllMode ? 150 : 500); // tighter polling during play-all for snappy transitions
}
function stopWatcher() { if (watchInterval) { clearInterval(watchInterval); watchInterval = null; } }
function setPlayIcon(playing) {
  document.getElementById('play-icon').innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}
function captureTime(field) {
  if (!player || !videoLoaded) { toast('Load a video first'); return; }
  document.getElementById(field + '-time').value = fmt(player.getCurrentTime());
}

/* ── Playlists ── */
function buildEmojiRow() {
  const row = document.getElementById('emoji-row');
  row.innerHTML = EMOJIS.map(e =>
    `<div class="emoji-opt${e === selectedEmoji ? ' selected' : ''}" onclick="selectEmoji('${e}')">${e}</div>`
  ).join('');
}
function selectEmoji(e) {
  selectedEmoji = e;
  document.querySelectorAll('.emoji-opt').forEach(el => el.classList.toggle('selected', el.textContent === e));
}
function toggleAddPlaylist() {
  const f = document.getElementById('pl-add-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  if (f.style.display === 'block') document.getElementById('pl-name-input').focus();
}
function createPlaylist() {
  const name = document.getElementById('pl-name-input').value.trim();
  if (!name) { toast('Enter a playlist name'); return; }
  playlists.push({ id: uid(), name, emoji: selectedEmoji });
  document.getElementById('pl-name-input').value = '';
  toggleAddPlaylist();
  saveToStorage();
  renderPlaylists();
  updatePlaylistSelect();
  toast('Playlist created');
}
function deletePlaylist(id) {
  if (!confirm('Delete this playlist? Clips will move to General.')) return;
  const general = playlists.find(p => p.name === 'General') || playlists[0];
  clips.forEach(c => { if (c.playlistId === id) c.playlistId = general.id; });
  playlists = playlists.filter(p => p.id !== id);
  if (!playlists.length) playlists.push({ id: uid(), name: 'General', emoji: '🏀' });
  if (activePl === id) activePl = null;
  saveToStorage();
  renderPlaylists();
  renderClips();
  updatePlaylistSelect();
}
function openRenameModal(id) {
  renameTarget = id;
  const pl = playlists.find(p => p.id === id);
  document.getElementById('rename-input').value = pl ? pl.name : '';
  document.getElementById('rename-modal').classList.remove('hidden');
  document.getElementById('rename-input').focus();
}
function closeRenameModal() { document.getElementById('rename-modal').classList.add('hidden'); renameTarget = null; }
function confirmRename() {
  const name = document.getElementById('rename-input').value.trim();
  if (!name) { toast('Enter a name'); return; }
  const pl = playlists.find(p => p.id === renameTarget);
  if (pl) pl.name = name;
  closeRenameModal();
  saveToStorage();
  renderPlaylists();
  updatePlaylistSelect();
  renderClips();
}
function selectPlaylist(id) {
  activePl = id;
  renderPlaylists();
  renderClips();
  const pl = id ? playlists.find(p => p.id === id) : null;
  document.getElementById('clips-panel-title').textContent = pl ? pl.name : 'All clips';
}
function renderPlaylists() {
  const allCount = clips.length;
  const list = document.getElementById('playlist-list');
  let html = `
    <div class="playlist-item${activePl === null ? ' active' : ''}" onclick="selectPlaylist(null)">
      <div class="pl-icon">📋</div>
      <div class="pl-info">
        <div class="pl-name">All clips</div>
        <div class="pl-count">${allCount} clip${allCount !== 1 ? 's' : ''}</div>
      </div>
    </div>`;
  playlists.forEach(pl => {
    const count = clips.filter(c => c.playlistId === pl.id).length;
    html += `
      <div class="playlist-item${activePl === pl.id ? ' active' : ''}" onclick="selectPlaylist('${pl.id}')">
        <div class="pl-icon">${pl.emoji}</div>
        <div class="pl-info">
          <div class="pl-name">${esc(pl.name)}</div>
          <div class="pl-count">${count} clip${count !== 1 ? 's' : ''}</div>
        </div>
        <div class="pl-actions">
          <button class="icon-btn" onclick="event.stopPropagation();openRenameModal('${pl.id}')" title="Rename">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn danger" onclick="event.stopPropagation();deletePlaylist('${pl.id}')" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>`;
  });
  list.innerHTML = html;
}
function updatePlaylistSelect() {
  const sel = document.getElementById('clip-playlist');
  sel.innerHTML = playlists.map(pl => `<option value="${pl.id}">${pl.emoji} ${esc(pl.name)}</option>`).join('');
}

/* ── Clips ── */
function visibleClips() {
  return activePl === null ? clips : clips.filter(c => c.playlistId === activePl);
}
function addClip() {
  const startStr = document.getElementById('start-time').value;
  const endStr = document.getElementById('end-time').value;
  if (!currentVideoId) { toast('Load a film first — clips need a source video'); return; }
  if (!startStr || !endStr) { toast('Enter start and end times'); return; }
  const start = parseTime(startStr);
  const end = parseTime(endStr);
  if (end <= start) { toast('End must be after start'); return; }
  const bufBefore = parseFloat(document.getElementById('buf-before').value);
  const bufAfter = parseFloat(document.getElementById('buf-after').value);
  const label = document.getElementById('clip-label').value.trim() || ('Clip ' + (clips.length + 1));
  const playlistId = document.getElementById('clip-playlist').value || (playlists[0] && playlists[0].id);
  const clip = { id: uid(), label, videoId: currentVideoId, start, end, bufBefore, bufAfter, effStart: Math.max(0, start - bufBefore), effEnd: end + bufAfter, playlistId };
  clips.push(clip);
  document.getElementById('start-time').value = '';
  document.getElementById('end-time').value = '';
  document.getElementById('clip-label').value = '';
  saveToStorage();
  renderPlaylists();
  renderClips();
  const vis = visibleClips();
  selectClipByIdx(vis.length - 1);
  toast('Clip added — press Play to watch it');
}
function selectClipByIdx(idx) {
  activeClipIdx = idx;
  renderClips();
  const vis = visibleClips();
  const clip = vis[idx];
  if (clip) {
    document.getElementById('now-label').textContent = clip.label;
    document.getElementById('now-sub').textContent =
      fmt(clip.effStart) + ' → ' + fmt(clip.effEnd) + '  ·  buf -' + clip.bufBefore + 's / +' + clip.bufAfter + 's';
    if (videoLoaded) document.getElementById('play-btn').disabled = false;
  }
}
function playClipAtIdx(idx, opts) {
  opts = opts || {};
  stopWatcher(); // always kill watcher before switching clips
  // Exit free mode when explicitly playing a clip
  if (freeMode) {
    freeMode = false;
    document.getElementById('free-btn').classList.remove('active');
  }
  // If manually picking a clip, exit play-all mode
  if (playAllMode && !opts.keepPlayAll) {
    playAllMode = false;
    updatePlayAllBtn();
  }
  selectClipByIdx(idx);
  const clip = visibleClips()[idx];
  if (!clip) return;
  // Clip belongs to a different film — swap the player over, then seek once it's ready
  if (clip.videoId && clip.videoId !== currentVideoId) {
    pendingSeek = { start: clip.effStart, play: true };
    document.getElementById('yt-url').value = 'https://www.youtube.com/watch?v=' + clip.videoId;
    loadVideo(clip.videoId);
    return;
  }
  if (!player || !videoLoaded) return;
  player.seekTo(clip.effStart, true);
  player.playVideo();
}
function togglePlay() {
  if (activeClipIdx < 0 || !player || !videoLoaded) return;
  if (isPlaying) {
    player.pauseVideo();
  } else {
    // Always replay from clip start when hitting the play button
    playClipAtIdx(activeClipIdx, { keepPlayAll: true });
  }
}
function prevClip() { const v = visibleClips(); if (!v.length) return; playClipAtIdx(activeClipIdx <= 0 ? v.length - 1 : activeClipIdx - 1); }
function nextClip() { const v = visibleClips(); if (!v.length) return; playClipAtIdx(activeClipIdx >= v.length - 1 ? 0 : activeClipIdx + 1); }
function playAll() {
  const v = visibleClips();
  if (!v.length) { toast('No clips to play'); return; }
  playAllMode = !playAllMode;
  if (playAllMode) {
    stopWatcher(); // will be restarted by playClipAtIdx -> playVideo -> onStateChange
    playClipAtIdx(activeClipIdx >= 0 ? activeClipIdx : 0, { keepPlayAll: true });
  } else {
    stopWatcher();
    player && player.pauseVideo();
  }
  updatePlayAllBtn();
}
function updatePlayAllBtn() {
  const btn = document.getElementById('play-all-btn');
  if (!btn) return;
  btn.textContent = playAllMode ? '⏹ Stop playlist' : '▶ Play all';
  btn.style.color = playAllMode ? 'var(--accent)' : '';
}
function deleteClip(id) {
  const idx = clips.findIndex(c => c.id === id);
  if (idx < 0) return;
  clips.splice(idx, 1);
  if (activeClipIdx >= visibleClips().length) activeClipIdx = visibleClips().length - 1;
  saveToStorage();
  renderPlaylists();
  renderClips();
  if (visibleClips().length === 0) { document.getElementById('now-label').textContent = 'No clip selected'; document.getElementById('now-sub').textContent = 'Select a clip or add one below'; document.getElementById('play-btn').disabled = true; }
}
function clearAllClips() {
  const list = visibleClips();
  if (!list.length) return;
  if (!confirm(`Delete all ${list.length} clip(s) in this view?`)) return;
  const ids = new Set(list.map(c => c.id));
  clips = clips.filter(c => !ids.has(c.id));
  activeClipIdx = -1;
  saveToStorage(); renderPlaylists(); renderClips();
  document.getElementById('now-label').textContent = 'No clip selected';
  document.getElementById('now-sub').textContent = 'Select a clip or add one below';
  document.getElementById('play-btn').disabled = true;
}
let freeMode = false;
let playAllMode = false;
function updateLoop() {
  loopEnabled = document.getElementById('loop-toggle').checked;
  document.getElementById('loop-label').classList.toggle('on', loopEnabled);
}
function toggleFreeMode() {
  freeMode = !freeMode;
  const btn = document.getElementById('free-btn');
  btn.classList.toggle('active', freeMode);
  btn.title = freeMode ? 'Free scrub active — clip enforcement off' : 'Release clip enforcement and scrub freely';
  if (freeMode) {
    stopWatcher();
    // Deselect active clip so nothing hijacks playback
    activeClipIdx = -1;
    renderClips();
    document.getElementById('now-label').textContent = 'Free scrub';
    document.getElementById('now-sub').textContent = 'Watcher off — scrub and play freely';
    document.getElementById('play-btn').disabled = true;
  } else {
    document.getElementById('now-label').textContent = 'No clip selected';
    document.getElementById('now-sub').textContent = 'Select a clip or add one below';
  }
}
function updateBufDisplay() {
  const b = parseFloat(document.getElementById('buf-before').value);
  const a = parseFloat(document.getElementById('buf-after').value);
  document.getElementById('buf-before-val').textContent = b % 1 === 0 ? b + 's' : b.toFixed(1) + 's';
  document.getElementById('buf-after-val').textContent = a % 1 === 0 ? a + 's' : a.toFixed(1) + 's';
}
function renderClips() {
  const vis = visibleClips();
  document.getElementById('clips-count').textContent = vis.length;
  const list = document.getElementById('clip-list');
  if (!vis.length) {
    list.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      <span>No clips in this view</span></div>`;
    return;
  }
  list.innerHTML = vis.map((c, i) => {
    const pl = playlists.find(p => p.id === c.playlistId);
    return `
      <div class="clip-item${i === activeClipIdx ? ' active' : ''}" onclick="selectClipByIdx(${i})">
        <div class="clip-num">${i + 1}</div>
        <div class="clip-body">
          <div class="clip-label-text">${esc(c.label)}</div>
          <div class="clip-meta">${fmt(c.effStart)} → ${fmt(c.effEnd)} &nbsp;·&nbsp; -${c.bufBefore}s / +${c.bufAfter}s</div>
          ${pl && activePl === null ? `<span class="clip-pl-badge">${pl.emoji} ${esc(pl.name)}</span>` : ''}
        </div>
        <div class="clip-btns">
          <button class="icon-btn" onclick="event.stopPropagation();playClipAtIdx(${i})" title="Play this clip">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn danger" onclick="event.stopPropagation();deleteClip('${c.id}')" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');
}

/* ── Import / Export ── */
function exportJSON() {
  const data = { playlists, clips };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'filmroom-clips.json';
  a.click();
  toast('Exported');
}
function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.clips) clips = data.clips;
      if (data.playlists) playlists = data.playlists;
      if (!playlists.length) playlists = [{ id: uid(), name: 'General', emoji: '🏀' }];
      saveToStorage();
      renderPlaylists(); renderClips(); updatePlaylistSelect();
      toast('Imported ' + clips.length + ' clips');
    } catch { toast('Invalid file'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* keyboard shortcuts */
document.addEventListener('keydown', (e) => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') nextClip();
  if (e.key === 'ArrowLeft') prevClip();
});
</script>
</body>
</html>

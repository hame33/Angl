<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Film Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --bg2: #141416;
    --bg3: #1c1c1f;
    --bg4: #232327;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f2;
    --text2: #9090a0;
    --text3: #55556a;
    --accent: #e8782a;
    --accent-bg: rgba(232,120,42,0.12);
    --accent-border: rgba(232,120,42,0.35);
    --info: #3d8ef0;
    --info-bg: rgba(61,142,240,0.1);
    --info-border: rgba(61,142,240,0.3);
    --success: #3ecf8e;
    --danger: #f05252;
    --danger-bg: rgba(240,82,82,0.1);
    --radius: 8px;
    --radius-lg: 12px;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Layout ── */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr 280px;
    grid-template-rows: 48px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Topbar ── */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .topbar-logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 15px; color: var(--accent);
    flex-shrink: 0;
  }
  .topbar-logo svg { width: 22px; height: 22px; }
  .topbar-divider { width: 1px; height: 24px; background: var(--border); }
  .url-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .url-input:focus { border-color: var(--border2); }
  .url-input::placeholder { color: var(--text3); }
  .btn {
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg4); border-color: var(--border2); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.accent:hover { background: #d0691f; border-color: #d0691f; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--bg3); border-color: var(--border); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

  /* ── Playlists sidebar ── */
  .sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .sidebar-title { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text2); }
  .icon-btn {
    width: 26px; height: 26px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--bg3); color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); border-color: rgba(240,82,82,0.3); }
  .icon-btn svg { width: 14px; height: 14px; }

  .playlist-list { flex: 1; overflow-y: auto; padding: 8px 8px; }
  .playlist-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
  }
  .playlist-item:hover { background: var(--bg3); }
  .playlist-item.active { background: var(--accent-bg); }
  .playlist-item.active .pl-name { color: var(--accent); }
  .pl-icon {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--bg4); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .playlist-item.active .pl-icon { background: var(--accent-bg); }
  .pl-info { flex: 1; min-width: 0; }
  .pl-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-count { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .pl-actions { display: none; gap: 2px; }
  .playlist-item:hover .pl-actions { display: flex; }

  .pl-add-form {
    padding: 10px 10px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .pl-add-form input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    margin-bottom: 6px;
  }
  .pl-add-form input:focus { border-color: var(--accent-border); }
  .pl-add-form input::placeholder { color: var(--text3); }
  .pl-emoji-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .emoji-opt {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg3);
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.12s;
  }
  .emoji-opt.selected { border-color: var(--accent); background: var(--accent-bg); }

  /* ── Main area ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  .player-wrap {
    position: relative;
    width: 100%;
    flex-shrink: 0;
    aspect-ratio: 16/9;
    max-height: 55vh;
    background: #000;
  }
  .player-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
  .player-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--text3);
  }
  .player-placeholder svg { width: 48px; height: 48px; opacity: 0.4; }
  .player-placeholder p { font-size: 13px; }

  /* ── Playback bar ── */
  .playback-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .play-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  .play-btn:hover { background: #d0691f; }
  .play-btn:active { transform: scale(0.95); }
  .play-btn:disabled { background: var(--bg4); color: var(--text3); cursor: not-allowed; }
  .play-btn svg { width: 16px; height: 16px; }

  .clip-nav { display: flex; gap: 4px; }
  .nav-btn { width: 30px; height: 30px; }

  .now-playing { flex: 1; min-width: 0; }
  .now-label { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .now-sub { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }

  .loop-toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text2); cursor: pointer;
    user-select: none; white-space: nowrap;
  }
  .loop-toggle input { accent-color: var(--accent); cursor: pointer; }
  .loop-toggle.on { color: var(--accent); }

  .free-btn {
    padding: 5px 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .free-btn:hover { background: var(--bg3); color: var(--text); }
  .free-btn.active { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }

  /* ── Add clip panel ── */
  .add-clip-panel {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text3);
    margin-bottom: 8px;
  }

  .field-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .field-row label { font-size: 12px; color: var(--text2); min-width: 36px; }
  .time-input {
    width: 72px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 8px;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
  }
  .time-input:focus { border-color: var(--border2); }
  .get-time-btn {
    font-size: 11px; padding: 4px 8px;
    background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text2); cursor: pointer;
    font-family: var(--sans);
    transition: background 0.12s;
  }
  .get-time-btn:hover { background: var(--bg3); color: var(--text); }

  .buffer-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .buffer-row label { font-size: 12px; color: var(--text2); min-width: 50px; }
  .buffer-row input[type=range] {
    flex: 1; accent-color: var(--accent);
    -webkit-appearance: none; height: 4px;
    background: var(--bg4); border-radius: 2px; outline: none; cursor: pointer;
  }
  .buffer-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  .buf-val { font-size: 12px; font-family: var(--mono); color: var(--text); min-width: 30px; text-align: right; }

  .text-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .text-input:focus { border-color: var(--border2); }
  .text-input::placeholder { color: var(--text3); }

  .pl-select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .pl-select:focus { border-color: var(--border2); }

  .divider { height: 1px; background: var(--border); margin: 2px 0; }

  /* ── Clips right panel ── */
  .clips-panel {
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .clips-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .clips-title { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text2); }
  .clip-count-badge {
    font-size: 11px; font-family: var(--mono);
    background: var(--bg4); color: var(--text2);
    padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--border);
  }

  .clip-list { flex: 1; overflow-y: auto; padding: 8px; }

  .clip-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 9px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.1s;
    margin-bottom: 2px;
  }
  .clip-item:hover { background: var(--bg3); }
  .clip-item.active { background: var(--info-bg); outline: 1px solid var(--info-border); }
  .clip-num {
    width: 20px; height: 20px; border-radius: 5px;
    background: var(--bg4); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; font-family: var(--mono);
    color: var(--text2); margin-top: 1px;
  }
  .clip-item.active .clip-num { background: var(--info-bg); color: var(--info); }
  .clip-body { flex: 1; min-width: 0; }
  .clip-label-text { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .clip-meta { font-size: 10px; font-family: var(--mono); color: var(--text3); }
  .clip-pl-badge {
    font-size: 10px; padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--text3);
    background: var(--bg4);
    display: inline-block; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
  }
  .clip-btns { display: none; gap: 2px; flex-shrink: 0; }
  .clip-item:hover .clip-btns { display: flex; }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--text3); font-size: 12px;
    padding: 3rem 1rem; text-align: center;
  }
  .empty-state svg { width: 32px; height: 32px; opacity: 0.4; }

  /* ── Export ── */
  .clips-footer {
    padding: 10px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    display: flex; gap: 6px;
  }

  /* ── View modes ── */
  .app.mode-dashboard { grid-template-columns: 1fr; }
  .app.mode-dashboard .sidebar,
  .app.mode-dashboard .main,
  .app.mode-dashboard .clips-panel { display: none; }
  .app.mode-film .dashboard { display: none; }
  .app.mode-dashboard .film-only { display: none !important; }

  /* ── Game switcher ── */
  .game-switcher { position: relative; flex: 1; min-width: 0; }
  .game-switch-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; max-width: 400px;
    padding: 6px 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    cursor: pointer; text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }
  .game-switch-btn:hover { background: var(--bg4); border-color: var(--border2); }
  .game-switch-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game-switch-btn svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--text3); }

  .game-menu {
    position: absolute; top: calc(100% + 6px); left: 0;
    width: 330px; max-height: 62vh; overflow-y: auto;
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius-lg); padding: 6px;
    z-index: 200; box-shadow: 0 14px 36px rgba(0,0,0,0.55);
  }
  .game-menu.hidden { display: none; }
  .game-menu-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px; border-radius: var(--radius); cursor: pointer;
  }
  .game-menu-item:hover { background: var(--bg3); }
  .game-menu-item.active { background: var(--accent-bg); }
  .game-menu-item.active .gm-name { color: var(--accent); }
  .gm-thumb {
    width: 46px; height: 27px; border-radius: 4px; object-fit: cover;
    background: var(--bg4); flex-shrink: 0; display: block;
  }
  .gm-info { flex: 1; min-width: 0; }
  .gm-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-count { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 1px; }
  .game-menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }
  .game-menu-action {
    padding: 8px; border-radius: var(--radius); cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--accent);
  }
  .game-menu-action:hover { background: var(--accent-bg); }

  /* ── Team switcher ── */
  .team-switcher { position: relative; display: inline-block; margin: 8px 0 6px; }
  .team-switch-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 999px;
    color: var(--text);
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .team-switch-btn:hover { background: var(--bg4); border-color: var(--accent-border); }
  .team-switch-btn svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--text3); }
  .team-switch-name { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .team-menu {
    position: absolute; top: calc(100% + 6px); left: 0;
    width: 300px; max-height: 60vh; overflow-y: auto;
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius-lg); padding: 6px;
    z-index: 220; box-shadow: 0 14px 36px rgba(0,0,0,0.55);
  }
  .team-menu.hidden { display: none; }
  .team-menu-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px; border-radius: var(--radius); cursor: pointer;
  }
  .team-menu-item:hover { background: var(--bg3); }
  .team-menu-item.active { background: var(--accent-bg); }
  .team-menu-item.active .tm-name { color: var(--accent); }
  .tm-info { flex: 1; min-width: 0; }
  .tm-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm-count { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 1px; }
  .tm-actions { display: none; gap: 2px; flex-shrink: 0; }
  .team-menu-item:hover .tm-actions { display: flex; }

  .team-add-form { padding: 8px; }
  .team-add-form input {
    width: 100%;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: var(--sans); font-size: 13px;
    padding: 6px 10px; outline: none; margin-bottom: 6px;
  }
  .team-add-form input:focus { border-color: var(--accent-border); }
  .team-add-form input::placeholder { color: var(--text3); }

  /* Team name heading the topbar's game list */
  .game-menu-head {
    font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text3);
    padding: 6px 8px 7px;
  }

  /* ── Dashboard ── */
  .dashboard { grid-column: 1 / -1; overflow-y: auto; background: var(--bg); }
  .dash-inner { max-width: 1180px; margin: 0 auto; padding: 26px 26px 56px; }
  .dash-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 24px; flex-wrap: wrap; margin-bottom: 26px;
  }
  .dash-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .dash-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .dash-stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 9px 16px; min-width: 90px;
  }
  .stat-val { font-size: 20px; font-weight: 600; font-family: var(--mono); line-height: 1.25; }
  .stat-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text3); margin-top: 2px;
  }

  .dash-section { margin-bottom: 30px; }
  .dash-section-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .dash-section-head h2 {
    font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text2);
  }
  .dash-hint { font-size: 11px; color: var(--text3); margin-left: auto; }

  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 14px; }
  .game-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden; cursor: pointer;

<script>
/* ── State ── */
let player = null;
let videoLoaded = false;
let currentVideoId = null;
let pendingSeek = null;   // {start, play} — applied once a newly loaded player is ready
let clips = [];
let playlists = [];   // each belongs to exactly one game
let games = [];       // a game is a title + the YouTube film it came from
let teams = [];       // a team (or season) owns games
let activeClipIdx = -1;
let activePl = null;       // null = every clip in the active game
let activeGame = null;     // game id
let activeTeam = null;     // team id; null = every team
let activeCategory = null; // playlist NAME, rolled up across the active team
let loadedGameId = null;   // whose film is in the player right now
let view = 'dashboard';    // 'dashboard' | 'film'
let isPlaying = false;
let loopEnabled = false;
let watchInterval = null;
let renameTarget = null;
let selectedEmoji = '🏀';

const EMOJIS = ['🏀','🎬','⚡','🔥','🛡️','🎯','💡','📌'];

// Seeded into a brand-new game only when there's no previous game to copy from.
const DEFAULT_TEAM_NAME = 'My team';

const DEFAULT_CATEGORIES = [
  { name: 'Offence',    emoji: '⚡' },
  { name: 'Defence',    emoji: '🛡️' },
  { name: 'Highlights', emoji: '🔥' },
];

/* ── Init ── */
window.addEventListener('DOMContentLoaded', () => {
  loadFromStorage();
  buildEmojiRow();
  renderPlaylists();
  renderClips();
  updatePlaylistSelect();
  updateBufDisplay();
  renderGameSwitcher();
  // The dashboard is home. The film itself loads lazily when a game is opened,
  // so returning to a big library doesn't pull down a video you didn't ask for.
  setView('dashboard');
});

/* ── Persistence ── */
function saveToStorage() {
  try {
    localStorage.setItem('filmroom_clips', JSON.stringify(clips));
    localStorage.setItem('filmroom_playlists', JSON.stringify(playlists));
    localStorage.setItem('filmroom_games', JSON.stringify(games));
    localStorage.setItem('filmroom_teams', JSON.stringify(teams));
    if (activeGame) localStorage.setItem('filmroom_active_game', activeGame);
    localStorage.setItem('filmroom_active_team', activeTeam || '');
    if (currentVideoId) localStorage.setItem('filmroom_video', currentVideoId);
  } catch(e) {}
}
function loadFromStorage() {
  try {
    const c = localStorage.getItem('filmroom_clips');
    const p = localStorage.getItem('filmroom_playlists');
    const g = localStorage.getItem('filmroom_games');
    const t = localStorage.getItem('filmroom_teams');
    if (c) clips     = JSON.parse(c) || [];
    if (p) playlists = JSON.parse(p) || [];
    if (g) games     = JSON.parse(g) || [];
    if (t) teams     = JSON.parse(t) || [];
  } catch(e) {
    clips = []; playlists = []; games = []; teams = [];
  }
  // Saves made before games existed have flat playlists and no gameId
  if (!games.length) migrateToGames(localStorage.getItem('filmroom_video'));
  // Saves made before teams existed have games with no teamId
  migrateToTeams();

  activeGame = localStorage.getItem('filmroom_active_game') || null;
  if (!games.some(g2 => g2.id === activeGame)) activeGame = games.length ? games[0].id : null;

  // Land on a real team rather than the mixed view — separating teams is the point
  const savedTeam = localStorage.getItem('filmroom_active_team') || null;
  const gameTeam = (games.find(g2 => g2.id === activeGame) || {}).teamId || null;
  activeTeam = teams.some(t2 => t2.id === savedTeam) ? savedTeam
             : (gameTeam || (teams.length ? teams[0].id : null));
}

/* Every game needs an owner. Pre-teams saves get one team holding all of them. */
function migrateToTeams() {
  const orphans = games.filter(g => !g.teamId);
  if (!orphans.length) return;
  let team = teams[0];
  if (!team) {
    team = { id: uid(), name: DEFAULT_TEAM_NAME, createdAt: Date.now() };
    teams.push(team);
  }
  orphans.forEach(g => { g.teamId = team.id; });
}

/*
 * Rebuild a game per distinct film, then copy each old playlist into every game
 * that actually used it — so a "Defence" list spanning two films becomes a
 * Defence playlist in each, holding the right clips. The dashboard rolls those
 * back up by name, which is what makes cross-game categories work.
 */
function migrateToGames(legacyVideoId) {
  if (!clips.length && !playlists.length && !legacyVideoId) return;

  const byVideo = new Map();
  clips.forEach(c => {
    const vid = c.videoId || legacyVideoId || null;
    const key = vid || '__unknown__';
    if (!byVideo.has(key)) byVideo.set(key, { videoId: vid, list: [] });
    byVideo.get(key).list.push(c);
  });
  // A film that was loaded but never clipped is still worth keeping
  if (!byVideo.size && legacyVideoId) byVideo.set(legacyVideoId, { videoId: legacyVideoId, list: [] });

  const oldPlaylists = playlists;
  playlists = [];
  let n = 0;

  byVideo.forEach(({ videoId, list }) => {
    n++;
    const game = {
      id: uid(),
      title: 'Game ' + n,
      videoId,
      createdAt: Date.now(),
      autoTitle: !!videoId,   // let the player fill in the real title later
    };
    games.push(game);

    const byName = new Map();
    list.forEach(c => {
      const old   = oldPlaylists.find(pl => pl.id === c.playlistId);
      const name  = old ? old.name  : 'General';
      const emoji = old ? old.emoji : '🏀';
      if (!byName.has(name)) {
        const pl = { id: uid(), gameId: game.id, name, emoji };
        byName.set(name, pl);
        playlists.push(pl);
      }
      c.gameId     = game.id;
      c.playlistId = byName.get(name).id;
      if (!c.videoId && videoId) c.videoId = videoId;
    });
    if (!byName.size) playlists.push({ id: uid(), gameId: game.id, name: 'General', emoji: '🏀' });
  });

  // Playlists that never held a clip would otherwise vanish — park them on the
  // first game so the categories the user set up survive the upgrade.
  const first = games[0];
  if (first) {
    oldPlaylists.forEach(op => {
      if (!playlists.some(pl => pl.name === op.name)) {
        playlists.push({ id: uid(), gameId: first.id, name: op.name, emoji: op.emoji });
      }
    });
  }
}

/* ── Utilities ── */
function uid() { return Math.random().toString(36).slice(2, 9); }
function parseTime(str) {
  str = (str || '').trim();
  const parts = str.split(':').map(Number);
  if (parts.length === 2) return parts[0] * 60 + (parts[1] || 0);
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + (parts[2] || 0);
  return parseFloat(str) || 0;
}
function fmt(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  return m + ':' + String(s).padStart(2,'0');
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

/* ── YouTube ── */
function extractVideoId(url) {
  url = url.trim();
  if (!url) return null;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const patterns = [
    /youtu\.be\/([^?&\s\/#]+)/,
    /[?&]v=([^&\s#]+)/,
    /youtube\.com\/embed\/([^?&\s\/#]+)/,
    /youtube\.com\/shorts\/([^?&\s\/#]+)/,
    /youtube\.com\/v\/([^?&\s\/#]+)/,
  ];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  return null;
}

function loadVideo(vidOverride) {
  const vid = vidOverride || extractVideoId(document.getElementById('yt-url').value.trim());
  if (!vid) { toast('Could not find a YouTube video ID in that URL.'); return; }

  // Tear down any existing player before swapping films
  stopWatcher();
  videoLoaded = false;
  if (player && player.destroy) { try { player.destroy(); } catch(e) {} }
  player = null;

  currentVideoId = vid;
  saveToStorage();
  document.getElementById('placeholder').style.display = 'none';
  const c = document.getElementById('player-container');
  c.style.display = 'block';
  c.innerHTML = '<div id="yt-player" style="width:100%;height:100%"></div>';
  if (window.YT && window.YT.Player) { createPlayer(vid); }
  else {
    window._ytPendingVid = vid;
    if (!document.getElementById('yt-api')) {
      const s = document.createElement('script');
      s.id = 'yt-api';
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }
  }
}
window.onYouTubeIframeAPIReady = () => { if (window._ytPendingVid) createPlayer(window._ytPendingVid); };
function createPlayer(vid) {
  player = new YT.Player('yt-player', {
    videoId: vid,
    host: 'https://www.youtube-nocookie.com',
    playerVars: { controls: 1, rel: 0, modestbranding: 1, playsinline: 1, origin: window.location.href },
    events: {
      onReady: () => {
        videoLoaded = true;
        tryAutoTitle(vid);
        document.getElementById('play-btn').disabled = activeClipIdx < 0;
        if (pendingSeek) {
          const p = pendingSeek; pendingSeek = null;
          player.seekTo(p.start, true);
          if (p.play) player.playVideo();
        }
      },
      onStateChange: (e) => {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING) {
          setPlayIcon(true); isPlaying = true;
          // Only start watcher if not already running (don't restart on every buffer resume)
          if (!watchInterval) startWatcher();
        } else if (e.data === S.PAUSED || e.data === S.ENDED) {
          // User-initiated pause or natural end — stop watcher and update icon
          stopWatcher(); setPlayIcon(false); isPlaying = false;
        }
        // BUFFERING (3) and CUED (5): do nothing — watcher keeps running through buffer stalls
      }
    }
  });
}

function startWatcher() {
  if (watchInterval) clearInterval(watchInterval); // restart with correct interval
  watchInterval = setInterval(() => {
    if (!player || activeClipIdx < 0) return;
    // Only enforce end-time when actually playing — ignore buffer stalls
    if (freeMode) return; // free scrub — never enforce clip boundaries
    const state = player.getPlayerState();
    if (state !== YT.PlayerState.PLAYING) return;
    const clip = visibleClips()[activeClipIdx];
    if (!clip) return;
    const cur = player.getCurrentTime();
    if (cur >= clip.effEnd) {
      if (loopEnabled) {
        player.seekTo(clip.effStart, true);
        player.playVideo();
      } else if (playAllMode) {
        // Auto-advance to next clip
        const vis = visibleClips();
        const nextIdx = activeClipIdx + 1;
        if (nextIdx < vis.length) {
          playClipAtIdx(nextIdx, { keepPlayAll: true });
        } else {
          // End of playlist
          stopWatcher();
          playAllMode = false;
          updatePlayAllBtn();
          player.pauseVideo();
          toast('End of playlist');
        }
      } else {
        stopWatcher();
        player.pauseVideo();
      }
    }
  }, playAllMode ? 150 : 500); // tighter polling during play-all for snappy transitions
}
function stopWatcher() { if (watchInterval) { clearInterval(watchInterval); watchInterval = null; } }
function setPlayIcon(playing) {
  document.getElementById('play-icon').innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}
function captureTime(field) {
  if (!player || !videoLoaded) { toast('Load a video first'); return; }
  document.getElementById(field + '-time').value = fmt(player.getCurrentTime());
}

function deletePlaylist(id) {

  const held = clips.filter(c => c.playlistId === id).length;
  const msg = held
    ? 'Delete "' + pl.name + '"? Its ' + held + ' clip(s) move to General in this game.'
    : 'Delete "' + pl.name + '"?';
  if (!confirm(msg)) return;

  // Clips stay inside their own game — never spill into another game's General
  const siblings = gamePlaylists(pl.gameId).filter(p => p.id !== id);
  let fallback = siblings.find(p => p.name === 'General') || siblings[0];
  if (!fallback) {
    fallback = { id: uid(), gameId: pl.gameId, name: 'General', emoji: '🏀' };
    playlists.push(fallback);

  clips.forEach(c => { if (c.playlistId === id) c.playlistId = fallback.id; });

/* ── Clips ── */
function visibleClips() {
  // A category spans games: match every playlist sharing that name
  if (activeCategory) {
    // Spans games, but never spans teams unless the mixed view is showing
    const gids = scopedGameIds();
    const ids = new Set(playlists.filter(p => p.name === activeCategory && gids.has(p.gameId)).map(p => p.id));
    return clips.filter(c => ids.has(c.playlistId));
  }
  let list = activeGame ? clips.filter(c => c.gameId === activeGame) : scopedClips();
  if (activePl) list = list.filter(c => c.playlistId === activePl);
  return list;
}
function addClip() {
  const startStr = document.getElementById('start-time').value;
  const endStr = document.getElementById('end-time').value;
  if (!currentVideoId) { toast('Load a film first — clips need a source video'); return; }
  if (!startStr || !endStr) { toast('Enter start and end times'); return; }
  const start = parseTime(startStr);
  const end = parseTime(endStr);
  if (end <= start) { toast('End must be after start'); return; }
  const bufBefore = parseFloat(document.getElementById('buf-before').value);
  const bufAfter = parseFloat(document.getElementById('buf-after').value);
  const label = document.getElementById('clip-label').value.trim() || ('Clip ' + (clips.length + 1));
  const game = filmGame();
  if (!game) { toast('This film has no game — open one from the dashboard'); return; }
  let playlistId = document.getElementById('clip-playlist').value;
  if (!playlistId || !playlists.some(pl => pl.id === playlistId && pl.gameId === game.id)) {
    // Every clip needs a home, even in a game whose playlists were all deleted
    const own = gamePlaylists(game.id);
    const fallback = own[0] || { id: uid(), gameId: game.id, name: 'General', emoji: '🏀' };
    if (!own.length) playlists.push(fallback);
    playlistId = fallback.id;
  }
  const clip = { id: uid(), label, videoId: currentVideoId, gameId: game.id, start, end, bufBefore, bufAfter, effStart: Math.max(0, start - bufBefore), effEnd: end + bufAfter, playlistId };
  clips.push(clip);
  document.getElementById('start-time').value = '';
  document.getElementById('end-time').value = '';
  document.getElementById('clip-label').value = '';
  saveToStorage();
  renderPlaylists();
  updatePlaylistSelect();
  renderClips();
  // The new clip may not be in view (wrong playlist filter) — select it only if it is
  const vis = visibleClips();
  const idx = vis.findIndex(c => c.id === clip.id);
  if (idx >= 0) selectClipByIdx(idx);
  toast('Clip added — press Play to watch it');
}
function selectClipByIdx(idx) {
  activeClipIdx = idx;
  renderClips();
  const vis = visibleClips();
  const clip = vis[idx];
  if (clip) {
    document.getElementById('now-label').textContent = clip.label;
    document.getElementById('now-sub').textContent =
      fmt(clip.effStart) + ' → ' + fmt(clip.effEnd) + '  ·  buf -' + clip.bufBefore + 's / +' + clip.bufAfter + 's';
    if (videoLoaded) document.getElementById('play-btn').disabled = false;
  }
}
function playClipAtIdx(idx, opts) {
  opts = opts || {};
  stopWatcher(); // always kill watcher before switching clips
  // Exit free mode when explicitly playing a clip
  if (freeMode) {
    freeMode = false;
    document.getElementById('free-btn').classList.remove('active');
  }
  // If manually picking a clip, exit play-all mode
  if (playAllMode && !opts.keepPlayAll) {
    playAllMode = false;
    updatePlayAllBtn();
  }
  selectClipByIdx(idx);
  const clip = visibleClips()[idx];
  if (!clip) return;
  if (clip.gameId) loadedGameId = clip.gameId;   // keeps "add clip" pointed at the right game
  // Clip belongs to a different film — swap the player over, then seek once it's ready
  if (clip.videoId && clip.videoId !== currentVideoId) {
    pendingSeek = { start: clip.effStart, play: true };
    document.getElementById('yt-url').value = 'https://www.youtube.com/watch?v=' + clip.videoId;
    loadVideo(clip.videoId);
    return;
  }
  // Player still spinning up (e.g. jumped straight here from the dashboard) —
  // hand the seek to onReady rather than dropping it on the floor
  if (!player || !videoLoaded) { pendingSeek = { start: clip.effStart, play: true }; return; }
  player.seekTo(clip.effStart, true);
  player.playVideo();
}
function togglePlay() {
  if (activeClipIdx < 0 || !player || !videoLoaded) return;
  if (isPlaying) {
    player.pauseVideo();
  } else {
    // Always replay from clip start when hitting the play button
    playClipAtIdx(activeClipIdx, { keepPlayAll: true });
  }
}
function prevClip() { const v = visibleClips(); if (!v.length) return; playClipAtIdx(activeClipIdx <= 0 ? v.length - 1 : activeClipIdx - 1); }
function nextClip() { const v = visibleClips(); if (!v.length) return; playClipAtIdx(activeClipIdx >= v.length - 1 ? 0 : activeClipIdx + 1); }
function playAll() {
  const v = visibleClips();
  if (!v.length) { toast('No clips to play'); return; }
  playAllMode = !playAllMode;
  if (playAllMode) {
    stopWatcher(); // will be restarted by playClipAtIdx -> playVideo -> onStateChange
    playClipAtIdx(activeClipIdx >= 0 ? activeClipIdx : 0, { keepPlayAll: true });
  } else {
    stopWatcher();
    player && player.pauseVideo();
  }
  updatePlayAllBtn();
}
function updatePlayAllBtn() {
  const btn = document.getElementById('play-all-btn');
  if (!btn) return;

  btn.style.color = playAllMode ? 'var(--accent)' : '';
}
function deleteClip(id) {
  const idx = clips.findIndex(c => c.id === id);
  if (idx < 0) return;
  // Remember the selected clip by identity — deleting anything above it in the
  // list would otherwise shift activeClipIdx onto a different clip.
  const current = visibleClips()[activeClipIdx];
  clips.splice(idx, 1);
  const stillVisible = current && current.id !== id
    ? visibleClips().findIndex(c => c.id === current.id)
    : -1;
  if (stillVisible < 0) { stopWatcher(); clearNowPlaying(); }
  else activeClipIdx = stillVisible;
  saveToStorage();
  renderPlaylists();
  renderClips();
}
function clearAllClips() {
  const list = visibleClips();
  if (!list.length) return;
  // On "All clips" this wipes every playlist, not just what's on screen — say so.
  const pl = activePl === null ? null : playlists.find(p => p.id === activePl);
  const game = currentGame();
  let scope;
  if (activeCategory)  scope = `all ${list.length} clip(s) in "${activeCategory}" across every game`;
  else if (pl)         scope = `all ${list.length} clip(s) in "${pl.name}"`;
  else if (game)       scope = `all ${list.length} clip(s) in "${game.title}"`;
  else                 scope = `all ${list.length} clip(s)`;
  if (!confirm(`Delete ${scope}?\n\nThis cannot be undone.`)) return;
  const ids = new Set(list.map(c => c.id));
  clips = clips.filter(c => !ids.has(c.id));
  stopWatcher();
  clearNowPlaying();
  saveToStorage(); renderPlaylists(); renderClips();
}

/* ── Import / Export ── */
function exportJSON() {
  // version 3 adds teams; clips keep videoId so old downloaders still work
  const data = { version: 3, teams, games, playlists, clips };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'filmroom-clips.json';
  a.click();
  toast('Exported');
}
function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.clips && !data.playlists && !data.games) { toast('Invalid file'); return; }
      clips     = data.clips     || [];
      playlists = data.playlists || [];
      games     = data.games     || [];
      teams     = data.teams     || [];
      // A version 1 export has no games — rebuild them from the clips' videoIds
      if (!games.length) migrateToGames(null);
      // A version 2 export has no teams — park every game under one
      migrateToTeams();
      activeTeam = teams.length ? teams[0].id : null;
      activeGame = games.length ? games[0].id : null;
      loadedGameId = null;
      activePl = null; activeCategory = null;
      currentVideoId = null;
      stopWatcher(); clearNowPlaying();
      saveToStorage();
      setView('dashboard');
      renderAll();
      toast('Imported ' + clips.length + ' clip(s) · ' + games.length + ' game(s) · ' + teams.length + ' team(s)');
    } catch { toast('Invalid file'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ── Teams ───────────────────────────────────────────────────────────────── */
/* A team owns games. Name it however you track them — "U16 Girls", "2025", or
 * "Senior Men 2025"; it is one free-text label, not a team/season pair. */
function createTeam(name) {
  name = (name || '').trim();
  if (!name) { toast('Enter a team name'); return; }
  if (teams.some(t => t.name.toLowerCase() === name.toLowerCase())) {
    toast('"' + name + '" already exists'); return;
  }
  const team = { id: uid(), name, createdAt: Date.now() };
  teams.push(team);
  selectTeam(team.id);
  toast('Team added');
}

function selectTeam(id) {
  activeTeam = id;                       // null = the mixed "All teams" view
  activeCategory = null;
  activePl = null;
  // The open game may belong to another team now
  const g = currentGame();
  if (!g || (activeTeam && g.teamId !== activeTeam)) {
    const pool = scopedGames();
    activeGame = pool.length ? pool[0].id : null;
  }
  closeTeamMenu();
  saveToStorage();
  renderAll();
}

function deleteTeam(id) {
  const t = teams.find(x => x.id === id);
  if (!t) return;
  const tGames = games.filter(g => g.teamId === id);
  const ids = new Set(tGames.map(g => g.id));
  const n = clips.filter(c => ids.has(c.gameId)).length;
  if (!confirm('Delete "' + t.name + '", its ' + tGames.length + ' game(s) and ' + n +
               ' clip(s)?\n\nThis cannot be undone.')) return;
  clips     = clips.filter(c => !ids.has(c.gameId));
  playlists = playlists.filter(pl => !ids.has(pl.gameId));
  games     = games.filter(g => !ids.has(g.id));
  teams     = teams.filter(x => x.id !== id);
  if (ids.has(loadedGameId)) loadedGameId = null;
  if (ids.has(activeGame)) {
    activeGame = null;
    currentVideoId = null;
    videoLoaded = false;
    if (player && player.destroy) { try { player.destroy(); } catch(e) {} }
    player = null;
    document.getElementById('player-container').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
  }
  activeTeam = teams.length ? teams[0].id : null;
  activeCategory = null; activePl = null;
  stopWatcher(); clearNowPlaying();
  saveToStorage();
  renderAll();
}

let addingTeam = false;
function toggleAddTeam(e) {
  if (e) e.stopPropagation();
  addingTeam = !addingTeam;
  renderTeamMenu();
  if (addingTeam) {
    const input = document.getElementById('new-team-name');
    if (input) input.focus();
  }
}
function submitNewTeam(e) {
  if (e) e.stopPropagation();
  const input = document.getElementById('new-team-name');
  if (!input) return;
  const name = input.value.trim();
  if (!name) { toast('Enter a team name'); return; }
  addingTeam = false;
  createTeam(name);   // selects the new team and re-renders
}

function renderTeamMenu() {
  const menu = document.getElementById('team-menu');
  if (!menu) return;
  let html = teams.map(t => {
    const tg = games.filter(g => g.teamId === t.id);
    const ids = new Set(tg.map(g => g.id));

    return `
      <div class="team-menu-item${t.id === activeTeam ? ' active' : ''}" onclick="selectTeam('${t.id}')">
        <div class="tm-info">

          <div class="tm-count">${tg.length} game${tg.length !== 1 ? 's' : ''} · ${n} clip${n !== 1 ? 's' : ''}</div>
        </div>
        <div class="tm-actions">
          <button class="icon-btn" onclick="event.stopPropagation();openRenameModal('${t.id}','team')" title="Rename team">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn danger" onclick="event.stopPropagation();deleteTeam('${t.id}')" title="Delete team">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>

  }).join('');
  if (!teams.length) html = `<div class="empty-state" style="padding:1.2rem 1rem"><span>No teams yet</span></div>`;
  if (teams.length > 1) {
    html += `<div class="team-menu-item${activeTeam === null ? ' active' : ''}" onclick="selectTeam(null)">

  }

function toggleTeamMenu(e) {
  if (e) e.stopPropagation();
  const menu = document.getElementById('team-menu');
  const opening = menu.classList.contains('hidden');
  if (opening) { addingTeam = false; renderTeamMenu(); }
  menu.classList.toggle('hidden', !opening);
}
function closeTeamMenu() {
  const menu = document.getElementById('team-menu');
  if (menu) menu.classList.add('hidden');
  addingTeam = false;
}
document.addEventListener('click', (e) => {
  const sw = document.getElementById('team-switcher');
  if (sw && !sw.contains(e.target)) closeTeamMenu();
});

/* ── Games ───────────────────────────────────────────────────────────────── */
function currentGame()      { return games.find(g => g.id === activeGame) || null; }
function currentTeam()      { return teams.find(t => t.id === activeTeam) || null; }
function gamePlaylists(id)  { return playlists.filter(p => p.gameId === id); }
function gameClips(id)      { return clips.filter(c => c.gameId === id); }
function gameTeam(g)        { return g ? teams.find(t => t.id === g.teamId) : null; }

/* Everything the dashboard shows is scoped to the active team.
 * activeTeam === null is the deliberate "All teams" overview. */
function scopedGames() {
  return activeTeam ? games.filter(g => g.teamId === activeTeam) : games;
}
function scopedGameIds()  { return new Set(scopedGames().map(g => g.id)); }
function scopedClips()    { const ids = scopedGameIds(); return clips.filter(c => ids.has(c.gameId)); }
function scopedPlaylists(){ const ids = scopedGameIds(); return playlists.filter(p => ids.has(p.gameId)); }

/*
 * The game whose film is actually on screen. In a cross-game category view the
 * sidebar's game and the loaded film differ, and new clips must follow the film.
 */
function filmGame() {
  // Two teams can hold the same film, so a videoId no longer identifies a game.
  // loadedGameId records which one we actually opened.
  const loaded = games.find(g => g.id === loadedGameId);
  if (loaded && (!currentVideoId || loaded.videoId === currentVideoId)) return loaded;
  return games.find(g => g.videoId && g.videoId === currentVideoId) || currentGame();
}

function thumbFor(videoId) {
  return videoId ? 'https://i.ytimg.com/vi/' + videoId + '/mqdefault.jpg' : '';
}

/* A new game inherits the previous game's categories, so a season keeps one
 * vocabulary and the dashboard's cross-game rollup lines up. */
function seedPlaylists(gameId, teamId) {
  const prev = games.filter(g => g.id !== gameId && g.teamId === teamId).slice(-1)[0];
  const template = prev
    ? gamePlaylists(prev.id).map(pl => ({ name: pl.name, emoji: pl.emoji }))
    : [];
  (template.length ? template : DEFAULT_CATEGORIES).forEach(t => {
    playlists.push({ id: uid(), gameId, name: t.name, emoji: t.emoji });
  });
}

function createGame(url, title) {
  const vid = extractVideoId(url || '');
  if (!vid) { toast('Could not find a YouTube video ID in that URL.'); return; }

  // A game must belong to a team, even when the mixed view is showing
  let team = currentTeam() || teams[0];
  if (!team) {
    team = { id: uid(), name: DEFAULT_TEAM_NAME, createdAt: Date.now() };
    teams.push(team);
  }
  activeTeam = team.id;

  // Paste once, then pick by name. Scoped to the team, so two squads can each
  // keep their own game for the same film.
  const existing = games.find(g => g.videoId === vid && g.teamId === team.id);
  if (existing) { toast('Already saved as "' + existing.title + '"'); openGame(existing.id); return; }

  const typed = (title || '').trim();
  const game = {
    id: uid(),
    teamId: team.id,
    title: typed || 'Untitled film',
    videoId: vid,
    createdAt: Date.now(),
    autoTitle: !typed,      // let the player supply a real title if we have none
  };
  games.push(game);
  seedPlaylists(game.id, team.id);
  saveToStorage();
  openGame(game.id);
  toast('Game added');
}

/* Fill in a title from the player, so a pasted link names itself. Best effort:
 * getVideoData() is often empty at onReady, hence the single retry. */
function tryAutoTitle(vid) {
  const apply = () => {
    const g = games.find(x => x.videoId === vid);
    if (!g || !g.autoTitle || !player || !player.getVideoData) return false;
    let data = null;
    try { data = player.getVideoData(); } catch(e) { return false; }
    if (!data || !data.title) return false;
    g.title = data.title;
    g.autoTitle = false;
    saveToStorage();
    renderGameSwitcher();
    renderPlaylists();
    if (view === 'dashboard') renderDashboard();
    return true;
  };
  if (!apply()) setTimeout(apply, 1500);
}

function openGame(id, opts) {
  opts = opts || {};
  const game = games.find(g => g.id === id);
  if (!game) return;
  activeGame = id;
  if (game.teamId) activeTeam = game.teamId;   // opening from the mixed view pins the team
  loadedGameId = id;
  activeCategory = null;
  activePl = opts.playlistId || null;
  stopWatcher();
  clearNowPlaying();
  playAllMode = false; updatePlayAllBtn();
  saveToStorage();
  setView('film');
  renderAll();
  if (game.videoId && game.videoId !== currentVideoId) loadVideo(game.videoId);
}

function deleteGame(id) {
  const g = games.find(x => x.id === id);
  if (!g) return;
  const n = gameClips(id).length;
  if (!confirm('Delete "' + g.title + '" and its ' + n + ' clip(s)?\n\nThis cannot be undone.')) return;
  clips     = clips.filter(c => c.gameId !== id);
  playlists = playlists.filter(pl => pl.gameId !== id);
  games     = games.filter(x => x.id !== id);
  if (loadedGameId === id) loadedGameId = null;
  if (activeGame === id) {
    const pool = scopedGames();
    activeGame = pool.length ? pool[0].id : (games.length ? games[0].id : null);
    activePl = null;
    currentVideoId = null;
    videoLoaded = false;
    if (player && player.destroy) { try { player.destroy(); } catch(e) {} }
    player = null;
    document.getElementById('player-container').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
  }
  activeCategory = null;
  stopWatcher(); clearNowPlaying();
  saveToStorage();
  renderAll();
}

/* ── Cross-game categories ───────────────────────────────────────────────── */
/* Playlists sharing a name across games are one category. */
function openCategory(name) {
  activeCategory = name;
  activePl = null;
  stopWatcher();
  clearNowPlaying();
  playAllMode = false; updatePlayAllBtn();
  setView('film');
  renderAll();
  toast('Play all works across games here');
}

function categoryRollup() {
  const map = new Map();
  const seed = (name, emoji) => {
    if (!map.has(name)) map.set(name, { name, emoji, count: 0, seconds: 0, games: new Set() });
    return map.get(name);
  };
  // Seed from playlists first so a category you made but haven't filled shows up
  const scopedPl = scopedPlaylists();
  const plIds = new Set(scopedPl.map(pl => pl.id));
  scopedPl.forEach(pl => seed(pl.name, pl.emoji).games.add(pl.gameId));
  clips.forEach(c => {
    if (!plIds.has(c.playlistId)) return;
    const pl = playlists.find(x => x.id === c.playlistId);
    if (!pl) return;
    const e = seed(pl.name, pl.emoji);
    e.count++;
    e.seconds += clipDuration(c);
  });
  return [...map.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
}

function clipDuration(c) { return Math.max(0, (c.effEnd || 0) - (c.effStart || 0)); }

function fmtDuration(total) {
  total = Math.round(total);
  if (total < 60) return total + 's';
  const m = Math.floor(total / 60), sec = total % 60;
  if (m < 60) return m + 'm ' + String(sec).padStart(2, '0') + 's';
  return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}

/* ── View switching ──────────────────────────────────────────────────────── */
function setView(v) {
  view = v;
  document.getElementById('app').className = 'app mode-' + v;
  closeGameMenu();
  if (v === 'dashboard') {
    // The player is only hidden, not destroyed — stop it so audio doesn't trail
    stopWatcher();
    playAllMode = false; updatePlayAllBtn();
    if (player && player.pauseVideo) { try { player.pauseVideo(); } catch(e) {} }
    renderDashboard();
  }
}

function updateClipsTitle() {
  const el = document.getElementById('clips-panel-title');
  if (activeCategory) { el.textContent = activeCategory + ' · all games'; return; }
  const pl = activePl ? playlists.find(p => p.id === activePl) : null;
  el.textContent = pl ? pl.name : 'All clips';
}

function renderAll() {
  renderPlaylists();
  renderClips();
  updatePlaylistSelect();
  updateClipsTitle();
  renderGameSwitcher();
  if (view === 'dashboard') renderDashboard();
}

/* ── Game switcher ───────────────────────────────────────────────────────── */
function renderGameSwitcher() {
  const game = currentGame();
  document.getElementById('game-switch-name').textContent =
    activeCategory ? activeCategory + ' · all games' : (game ? game.title : 'No film loaded');
  document.getElementById('game-switch-emoji').textContent = activeCategory ? '🗂️' : '🎬';

  const menu = document.getElementById('game-menu');
  const pool = scopedGames();

  let html = team
    ? `<div class="game-menu-head">${esc(team.name)}</div>`
    : `<div class="game-menu-head">All teams</div>`;
  html += pool.map(g => {
    const n = gameClips(g.id).length;
    const thumb = thumbFor(g.videoId);
    return `
      <div class="game-menu-item${g.id === activeGame && !activeCategory ? ' active' : ''}" onclick="openGame('${g.id}')">
        ${thumb ? `<img class="gm-thumb" src="${thumb}" alt="" onerror="this.style.visibility='hidden'" />`
                : `<div class="gm-thumb"></div>`}
        <div class="gm-info">
          <div class="gm-name">${esc(g.title)}</div>
          <div class="gm-count">${n} clip${n !== 1 ? 's' : ''} · ${gamePlaylists(g.id).length} playlist(s)</div>
        </div>
      </div>`;
  }).join('');
  if (!pool.length) html += `<div class="empty-state" style="padding:1.2rem 1rem"><span>No games in this team</span></div>`;
  html += `<div class="game-menu-sep"></div>
    <div class="game-menu-action" onclick="setView('dashboard')">＋  New game…</div>
    <div class="game-menu-action" onclick="setView('dashboard')">⇄  Switch team…</div>`;
  menu.innerHTML = html;
}

function toggleGameMenu(e) {
  if (e) e.stopPropagation();
  const menu = document.getElementById('game-menu');
  const opening = menu.classList.contains('hidden');
  if (opening) renderGameSwitcher();
  menu.classList.toggle('hidden', !opening);
}
function closeGameMenu() {
  const menu = document.getElementById('game-menu');
  if (menu) menu.classList.add('hidden');
}
document.addEventListener('click', (e) => {
  const sw = document.getElementById('game-switcher');
  if (sw && !sw.contains(e.target)) closeGameMenu();
});

/* ── Move a clip between playlists ───────────────────────────────────────── */
let moveTarget = null;
function openMoveModal(clipId) {
  const c = clips.find(x => x.id === clipId);
  if (!c) return;
  moveTarget = clipId;
  // Only this clip's own game — moving a clip between games would orphan its film
  const own = gamePlaylists(c.gameId);
  const g = games.find(x => x.id === c.gameId);
  document.getElementById('move-sub').textContent = g ? 'Playlists in ' + g.title : 'Choose a playlist';
  const sel = document.getElementById('move-select');
  sel.innerHTML = own.map(pl =>
    `<option value="${pl.id}"${pl.id === c.playlistId ? ' selected' : ''}>${pl.emoji} ${esc(pl.name)}</option>`
  ).join('') || '<option value="">No playlists in this game</option>';
  document.getElementById('move-modal').classList.remove('hidden');
}
function closeMoveModal() {
  document.getElementById('move-modal').classList.add('hidden');
  moveTarget = null;
}
function confirmMove() {
  const id = document.getElementById('move-select').value;
  const c = clips.find(x => x.id === moveTarget);
  if (c && id) {
    // Follow the clip across the move — the filtered list is about to change
    const wasActive = visibleClips()[activeClipIdx];
    c.playlistId = id;
    const idx = wasActive ? visibleClips().findIndex(x => x.id === wasActive.id) : -1;
    if (idx < 0) { stopWatcher(); clearNowPlaying(); } else activeClipIdx = idx;
    saveToStorage();
    toast('Clip moved');
  }
  closeMoveModal();
  renderAll();
}

/* ── Dashboard ───────────────────────────────────────────────────────────── */
function playClipFromDashboard(clipId) {
  const c = clips.find(x => x.id === clipId);
  if (!c) return;
  openGame(c.gameId, { playlistId: c.playlistId });
  const idx = visibleClips().findIndex(x => x.id === clipId);
  if (idx >= 0) playClipAtIdx(idx);   // seek is queued if the player is still loading
}

function addGameFromForm() {
  const url = document.getElementById('new-game-url').value;
  const title = document.getElementById('new-game-title').value;
  if (!url.trim()) { toast('Paste a YouTube URL'); return; }
  document.getElementById('new-game-url').value = '';
  document.getElementById('new-game-title').value = '';
  createGame(url, title);
}

function renderDashboard() {
  const el = document.getElementById('dashboard');
  const inScope   = scopedClips();
  const myGames   = scopedGames();
  const myPl      = scopedPlaylists();
  const totalSecs = inScope.reduce((sum, c) => sum + clipDuration(c), 0);
  const cats = categoryRollup();
  const maxCat = cats.reduce((m, c) => Math.max(m, c.count), 0) || 1;
  const team = currentTeam();

  const stats = [
    ['Games',      myGames.length],
    ['Clips',      inScope.length],
    ['Categories', new Set(myPl.map(p => p.name)).size],
    ['Footage',    fmtDuration(totalSecs)],
  ].map(([label, val]) => `
    <div class="stat"><div class="stat-val">${val}</div><div class="stat-label">${label}</div></div>`
  ).join('');

  const gameCards = myGames.map(g => {
    const n = gameClips(g.id).length;
    const secs = gameClips(g.id).reduce((sum, c) => sum + clipDuration(c), 0);
    const thumb = thumbFor(g.videoId);
    const chips = gamePlaylists(g.id).map(pl => {
      const count = clips.filter(c => c.playlistId === pl.id).length;
      return `<span class="chip${count ? '' : ' muted'}"
        onclick="event.stopPropagation();openGame('${g.id}',{playlistId:'${pl.id}'})"

    }).join('');
    return `
      <div class="game-card${g.id === activeGame ? ' active' : ''}" onclick="openGame('${g.id}')">
        <div class="game-thumb">
          ${thumb ? `<img src="${thumb}" alt="" onerror="this.style.display='none'" />` : ''}
          <span class="game-thumb-badge">${n} clip${n !== 1 ? 's' : ''}</span>
        </div>
        <div class="game-card-actions">
          <button class="icon-btn" onclick="event.stopPropagation();openRenameModal('${g.id}','game')" title="Rename game">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn danger" onclick="event.stopPropagation();deleteGame('${g.id}')" title="Delete game">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
        <div class="game-card-body">
          <div class="game-card-title">${esc(g.title)}</div>
          <div class="game-card-meta">${activeTeam === null && gameTeam(g) ? esc(gameTeam(g).name) + ' · ' : ''}${fmtDuration(secs)} of clips</div>
          <div class="game-chips">${chips}</div>
        </div>
      </div>`;
  }).join('');

  const addCard = `
    <div class="add-game-card">
      <div class="section-label">Add a game</div>
      <input class="url-input" id="new-game-url" placeholder="Paste YouTube URL…"
             onkeydown="if(event.key==='Enter')addGameFromForm()" />
      <input class="text-input" id="new-game-title" placeholder="Game title (optional)"
             onkeydown="if(event.key==='Enter')addGameFromForm()" />
      <button class="btn accent" onclick="addGameFromForm()">Add game</button>
      <div style="font-size:10px;color:var(--text3);line-height:1.4">
        Leave the title blank and it's taken from the video.
      </div>
    </div>`;

  const catRows = cats.length ? cats.map(c => `
    <div class="cat-row" onclick="openCategory('${esc(c.name).replace(/'/g, "\\'")}')">
      <div class="cat-emoji">${c.emoji}</div>
      <div class="cat-info">
        <div class="cat-name">${esc(c.name)}</div>
        <div class="cat-meta">${c.games.size} game${c.games.size !== 1 ? 's' : ''} · ${fmtDuration(c.seconds)}</div>
      </div>
      <div class="cat-bar"><span style="width:${Math.round((c.count / maxCat) * 100)}%"></span></div>
      <div class="cat-count">${c.count}</div>
    </div>`).join('')
    : `<div class="empty-state"><span>No categories yet</span></div>`;

  const recent = inScope.slice(-9).reverse().map(c => {
    const g = games.find(x => x.id === c.gameId);
    const pl = playlists.find(x => x.id === c.playlistId);
    return `
      <div class="recent-item" onclick="playClipFromDashboard('${c.id}')">
        <div class="cat-emoji">${pl ? pl.emoji : '🎬'}</div>
        <div class="recent-body">
          <div class="recent-label">${esc(c.label)}</div>
          <div class="recent-meta">${g ? esc(g.title) : 'Unknown game'} · ${fmt(c.effStart)} → ${fmt(c.effEnd)}</div>
        </div>
        <div class="recent-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
      </div>`;
  }).join('') || `<div class="empty-state"><span>No clips yet</span></div>`;

  el.innerHTML = `
    <div class="dash-inner">
      <div class="dash-head">
        <div style="min-width:0">
          <h1>Film library</h1>
          <div class="team-switcher" id="team-switcher">
            <button class="team-switch-btn" onclick="toggleTeamMenu(event)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span class="team-switch-name">${team ? esc(team.name) : 'All teams'}</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="team-menu hidden" id="team-menu"></div>
          </div>
          <div class="dash-sub">${team ? 'Every clip for this team, across every game.'
                                       : 'Every clip you\'ve cut, across every team.'}</div>
        </div>
        <div class="dash-stats">${stats}</div>
      </div>

      <div class="dash-section">
        <div class="dash-section-head">
          <h2>Games</h2>
          <span class="clip-count-badge">${myGames.length}</span>
          ${myGames.length ? `<span class="dash-hint">Click a game to open the film room · click a chip to jump straight to that playlist</span>` : ''}
        </div>
        <div class="game-grid">${gameCards}${addCard}</div>
      </div>

      <div class="dash-cols">
        <div class="dash-section">
          <div class="dash-section-head">
            <h2>Categories</h2>
            <span class="dash-hint">Across all games</span>
          </div>
          ${catRows}
        </div>
        <div class="dash-section">
          <div class="dash-section-head">
            <h2>Recent clips</h2>
          </div>
          ${recent}
        </div>
      </div>
    </div>`;
}

/* keyboard shortcuts */
document.addEventListener('keydown', (e) => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'Escape') { closeGameMenu(); closeTeamMenu(); closeRenameModal(); closeMoveModal(); return; }
  if (view !== 'film') return;   // no hidden player to drive from the dashboard
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') nextClip();
  if (e.key === 'ArrowLeft') prevClip();
});
</script>
</body>
</html>
